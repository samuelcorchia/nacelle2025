version: '3'

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: web
    ports:
      - 8002:80
    volumes:
      - ./php:/var/www/html
    environment:
      APP_ENV: dev
      APP_ROOT_PASSWORD: rootPass
      APP_DATABASE: monapp
      APP_USER: samuel.corchia
      APP_PASSWORD: Br6dd534
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: mysql
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=rootPass
      - MYSQL_DATABASE=monapp
      - MYSQL_USER=samuel.corchia
      - MYSQL_PASSWORD=Br6dd534
    volumes:
      - db_data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - 8081:80
    depends_on:
      - db
volumes:
  db_data: